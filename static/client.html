<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>屏幕观看端 (Client)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        .login-section {
            background: white;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .login-section .icon {
            font-size: 56px;
            margin-bottom: 15px;
        }
        .login-section h2 { 
            color: #333;
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .login-section p {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .room-input {
            padding: 16px;
            font-size: 28px;
            text-align: center;
            letter-spacing: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            width: 220px;
            margin: 15px auto;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }
        .room-input:focus { 
            outline: none; 
            border-color: #2196F3;
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.1);
        }
        .btn {
            padding: 14px 30px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            margin: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary { 
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white; 
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #1976D2 0%, #1565C0 100%);
        }
        .btn-home {
            background: linear-gradient(135deg, #757575 0%, #616161 100%);
            color: white;
        }
        .btn-home:hover {
            background: linear-gradient(135deg, #616161 0%, #424242 100%);
        }
        .btn-fullscreen {
            background: linear-gradient(135deg, #333 0%, #222 100%);
            color: white;
            border: 1px solid #555;
        }
        .btn-fullscreen:hover {
            background: linear-gradient(135deg, #444 0%, #333 100%);
        }
        
        .watch-section { display: none; }
        .watch-section.active { display: block; }
        
        .room-info {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .room-info .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .room-info p {
            color: #666;
            margin-bottom: 10px;
        }
        .room-code {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            /* 保持视频比例 */
            aspect-ratio: 16 / 9;
        }
        video { 
            width: 100%; 
            height: 100%;
            display: block;
            cursor: pointer;
            object-fit: contain;
        }
        /* 全屏模式下的样式 */
        .video-container:fullscreen,
        .video-container:-webkit-full-screen,
        video:fullscreen,
        video:-webkit-full-screen {
            border-radius: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
        .play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 18px 36px;
            border-radius: 30px;
            font-size: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            font-weight: 600;
        }
        .play-hint.show {
            opacity: 1;
        }
        
        .status-message {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .status-message .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error { color: #f44336; }
        .success { color: #4CAF50; }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            font-weight: 500;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }
        .notification.error { 
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }
        .notification.success { 
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .hidden { display: none !important; }
        
        /* 移动端适配 */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .login-section { padding: 35px 25px; }
            .login-section .icon { font-size: 48px; }
            .login-section h2 { font-size: 24px; }
            .room-input { 
                width: 200px;
                font-size: 24px;
                letter-spacing: 8px;
            }
            .btn { 
                padding: 12px 24px;
                font-size: 16px;
            }
            .room-info { padding: 22px 18px; }
            .room-info .icon { font-size: 40px; }
            .room-code { font-size: 28px; }
        }
        @media (max-width: 480px) {
            .login-section { padding: 30px 20px; }
            .room-input { 
                width: 180px;
                font-size: 22px;
                letter-spacing: 6px;
            }
            .btn { 
                padding: 11px 20px;
                font-size: 15px;
            }
            .play-hint {
                padding: 15px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loginSection" class="login-section">
            <h2>📺 加入屏幕共享</h2>
            <p>请输入房间号</p>
            <input type="text" id="roomInput" class="room-input" 
                   maxlength="8" placeholder="000000" 
                   oninput="this.value = this.value.replace(/\D/g, '')">
            <br>
            <button id="joinBtn" class="btn btn-primary" onclick="joinRoom()">加入</button>
            <button class="btn btn-home" onclick="goHome()">🏠 返回首页</button>
        </div>
        
        <div id="waitingSection" class="status-message" style="display: none;">
            <div class="spinner"></div>
            <h3 id="waitingTitle">等待主机确认...</h3>
            <p id="waitingText">房间号: <span id="waitingRoomCode"></span></p>
        </div>
        
        <div id="watchSection" class="watch-section">
            <div class="room-info">
                <p>正在观看</p>
                <div class="room-code">房间: <span id="watchRoomCode"></span></div>
                <div style="margin-top: 15px;">
                    <button class="btn btn-home" onclick="goHome()">🏠 返回首页</button>
                </div>
            </div>
            <div class="video-container">
                <video id="remoteVideo" autoplay playsinline muted 
                       webkit-playsinline
                       style="width: 100%; height: 100%; object-fit: contain;"></video>
                <div id="playHint" class="play-hint">▶ 点击播放</div>
                <button id="fullscreenBtn" class="btn btn-fullscreen" onclick="toggleFullscreen()" 
                        style="position: absolute; bottom: 15px; right: 15px; padding: 8px 15px; font-size: 14px; z-index: 10;">
                    ⛶ 全屏
                </button>
            </div>
        </div>
        
        <div id="rejectedSection" class="status-message" style="display: none;">
            <h3 class="error">❌ 加入请求被拒绝</h3>
            <p>主机拒绝了您的加入请求</p>
            <button class="btn btn-primary" onclick="goBack()">返回重新加入</button>
            <button class="btn btn-home" onclick="goHome()">🏠 返回首页</button>
        </div>
    </div>
    
    <div id="notification" class="notification hidden"></div>
    
    <script>
        const WS_URL = `wss://${window.location.host}/ws`;
        
        let ws = null;
        let peerConnection = null;
        let roomCode = null;
        let clientId = null;
        
        const loginSection = document.getElementById('loginSection');
        const waitingSection = document.getElementById('waitingSection');
        const watchSection = document.getElementById('watchSection');
        const rejectedSection = document.getElementById('rejectedSection');
        const roomInput = document.getElementById('roomInput');
        const waitingRoomCode = document.getElementById('waitingRoomCode');
        const watchRoomCode = document.getElementById('watchRoomCode');
        const remoteVideo = document.getElementById('remoteVideo');
        const waitingTitle = document.getElementById('waitingTitle');
        const notification = document.getElementById('notification');
        
        function joinRoom() {
            const code = roomInput.value.trim();
            if (code.length < 4) {
                showNotification('请输入正确的房间号', 'error');
                return;
            }
            roomCode = code;
            loginSection.style.display = 'none';
            waitingSection.style.display = 'block';
            waitingRoomCode.textContent = roomCode;
            waitingTitle.textContent = '等待主机确认...';
            connectWebSocket();
        }
        
        function connectWebSocket() {
            ws = new WebSocket(`${WS_URL}/client/${roomCode}`);
            
            ws.onopen = () => {
                console.log('[WS] Connected');
            };
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                console.log('[WS] Received:', data.type);
                
                if (data.type === 'client_id') {
                    clientId = data.client_id;
                }
                else if (data.type === 'join_approved') {
                    waitingTitle.textContent = '等待主机建立连接...';
                }
                else if (data.type === 'join_rejected') {
                    showRejected();
                }
                else if (data.type === 'offer') {
                    await handleOffer(data);
                }
                else if (data.type === 'ice_candidate') {
                    handleIceCandidate(data);
                }
            };
            
            ws.onclose = () => console.log('[WS] Disconnected');
            ws.onerror = (e) => console.error('[WS] Error:', e);
        }
        
        // 纯局域网模式：同一网段内 WebRTC 可以直接通过 host candidate 建立连接
        // 不需要 STUN/TURN 服务器，减少连接建立时间
        async function handleOffer(data) {
            const config = {
                // iceServers 留空，强制使用 host 类型 candidate（本地直连）
                iceServers: [],
                // 只收集 host 类型的 candidate，跳过 srflx/relay
                iceTransportPolicy: 'all'
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.ontrack = async (event) => {
                console.log('[WebRTC] ontrack');
                remoteVideo.srcObject = event.streams[0];
                
                // 尝试自动播放
                try {
                    await remoteVideo.play();
                    console.log('[Video] Auto play success');
                    playHint.classList.remove('show');
                } catch (err) {
                    console.warn('[Video] Auto play failed:', err.message);
                    // 如果自动播放失败（浏览器策略），显示提示让用户点击
                    playHint.classList.add('show');
                    showNotification('请点击视频开始播放', 'info');
                }
                
                waitingSection.style.display = 'none';
                watchSection.classList.add('active');
                watchRoomCode.textContent = roomCode;
                showNotification('连接成功！', 'success');
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    ws.send(JSON.stringify({
                        type: 'ice_candidate',
                        client_id: clientId,
                        candidate: event.candidate.candidate,
                        sdpMid: event.candidate.sdpMid,
                        sdpMLineIndex: event.candidate.sdpMLineIndex
                    }));
                }
            };
            
            peerConnection.oniceconnectionstatechange = () => {
                console.log('[WebRTC] ICE:', peerConnection.iceConnectionState);
            };
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription({
                type: data.sdpType || 'offer',
                sdp: data.sdp
            }));
            
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            
            ws.send(JSON.stringify({
                type: 'answer',
                client_id: clientId,
                sdp: answer.sdp,
                sdpType: answer.type
            }));
            console.log('[Client] Answer sent');
        }
        
        async function handleIceCandidate(data) {
            if (!peerConnection || !peerConnection.remoteDescription) return;
            
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate({
                    candidate: data.candidate,
                    sdpMid: data.sdpMid,
                    sdpMLineIndex: data.sdpMLineIndex
                }));
            } catch (e) {
                console.log('[Client] ICE error (ignored):', e.message);
            }
        }
        
        function showRejected() {
            waitingSection.style.display = 'none';
            rejectedSection.style.display = 'block';
            ws.close();
        }
        
        function goBack() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            loginSection.style.display = 'block';
            waitingSection.style.display = 'none';
            watchSection.classList.remove('active');
            rejectedSection.style.display = 'none';
            roomInput.value = '';
            remoteVideo.srcObject = null;
            playHint.classList.remove('show');
        }
        
        // 返回主页
        function goHome() {
            // 如果正在观看，先断开连接
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (ws) {
                ws.close();
                ws = null;
            }
            
            // 跳转到首页
            window.location.href = '/';
        }
        
        function showNotification(message, type = '') {
            notification.textContent = message;
            notification.className = 'notification';
            if (type) notification.classList.add(type);
            setTimeout(() => notification.classList.add('hidden'), 3000);
        }
        
        roomInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinRoom();
        });
        
        const playHint = document.getElementById('playHint');
        
        // 更新播放提示显示状态
        function updatePlayHint() {
            if (remoteVideo.paused && remoteVideo.srcObject) {
                playHint.classList.add('show');
            } else {
                playHint.classList.remove('show');
            }
        }
        
        // 点击视频区域切换播放/暂停（备用方案）
        remoteVideo.addEventListener('click', async () => {
            if (remoteVideo.paused) {
                try {
                    await remoteVideo.play();
                    playHint.classList.remove('show');
                } catch (err) {
                    console.warn('[Video] Play failed:', err.message);
                    showNotification('播放失败，请重试', 'error');
                }
            } else {
                remoteVideo.pause();
                playHint.classList.add('show');
            }
        });
        
        // 监听播放状态变化
        remoteVideo.addEventListener('play', () => playHint.classList.remove('show'));
        remoteVideo.addEventListener('pause', () => updatePlayHint());
        
        // 页面可见性变化时恢复播放
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && remoteVideo.srcObject && remoteVideo.paused) {
                remoteVideo.play()
                    .then(() => playHint.classList.remove('show'))
                    .catch(() => playHint.classList.add('show'));
            }
        });
        
        // 全屏功能
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        function toggleFullscreen() {
            const video = document.getElementById('remoteVideo');
            const container = document.querySelector('.video-container');
            
            // 移动端使用 video 元素全屏，桌面端使用容器全屏
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // 尝试进入全屏
                const fullscreenPromise = (video.webkitRequestFullscreen || 
                                           video.requestFullscreen || 
                                           video.webkitEnterFullscreen).call(video);
                
                if (fullscreenPromise instanceof Promise) {
                    fullscreenPromise.then(() => {
                        fullscreenBtn.textContent = '⛶ 退出全屏';
                    }).catch(err => {
                        console.error('全屏失败:', err.message);
                        showNotification('全屏失败，请重试', 'error');
                    });
                }
            } else {
                // 退出全屏
                const exitPromise = document.exitFullscreen || document.webkitExitFullscreen;
                if (exitPromise) {
                    exitPromise.call(document).then(() => {
                        fullscreenBtn.textContent = '⛶ 全屏';
                    }).catch(err => {
                        console.error('退出全屏失败:', err.message);
                    });
                }
            }
        }
        
        // 监听全屏状态变化（支持按 ESC 退出全屏）
        function updateFullscreenBtn() {
            const isFullscreen = document.fullscreenElement || 
                                document.webkitFullscreenElement ||
                                document.webkitDisplayingFullscreen;
            if (isFullscreen) {
                fullscreenBtn.textContent = '⛶ 退出全屏';
            } else {
                fullscreenBtn.textContent = '⛶ 全屏';
            }
        }
        
        document.addEventListener('fullscreenchange', updateFullscreenBtn);
        document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);
        
        // iOS 特殊处理：监听 video 的 webkitbeginfullscreen 和 webkitendfullscreen 事件
        remoteVideo.addEventListener('webkitbeginfullscreen', () => {
            fullscreenBtn.textContent = '⛶ 退出全屏';
        });
        remoteVideo.addEventListener('webkitendfullscreen', () => {
            fullscreenBtn.textContent = '⛶ 全屏';
        });
    </script>
</body>
</html>
